services:
  dvwa:
    image: vulnerables/web-dvwa
    container_name: lab-dvwa
    networks:
      labnet:
        ipv4_address: 172.30.0.10

  victim:
    build: ./victim
    container_name: lab-victim
    networks:
      labnet:
        ipv4_address: 172.30.0.11

  attacker:
    build: ./attacker
    container_name: lab-attacker
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./attack-scripts:/work
    networks:
      labnet:
        ipv4_address: 172.30.0.20

  # Sensors share the attacker's network namespace, so they see every
  # packet it sends or receives, whether the target is DVWA or the
  # victim host (scan/DDoS/brute-force/SQLi all originate here).
  suricata:
    image: jasonish/suricata:latest
    container_name: lab-suricata
    network_mode: "service:attacker"
    depends_on:
      - attacker
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    command: ["-i", "eth0", "-k", "none", "-S", "/lab-rules/local.rules"]
    volumes:
      - ./sensors/suricata:/lab-rules:ro
      - ./sensors/logs/suricata:/var/log/suricata

  zeek:
    image: zeek/zeek:latest
    container_name: lab-zeek
    network_mode: "service:attacker"
    depends_on:
      - attacker
    cap_add:
      - NET_ADMIN
      - NET_RAW
    working_dir: /logs
    command: ["zeek", "-i", "eth0", "local", "LogAscii::use_json=T"]
    volumes:
      - ./sensors/logs/zeek:/logs

networks:
  labnet:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24